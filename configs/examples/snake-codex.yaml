# Codex (GPT) agents on the snake task: the same tools, sandbox, canon and
# opening round as the Claude example; only the model loop differs.
# Needs a `codex login` on this machine (the login is symlinked, never copied).
run_name: snake-codex
backend: codex
model: gpt-6-luna
effort: medium
system_prompt: ""
task_dir: ../../tasks/snake
n_agents: 10
# List prices, for the harness's cost estimate and caps. On a subscription the
# marginal cost is zero and this is a notional figure; the caps still act on it.
prices:
  input: 0.10
  output: 0.50
  cache_read_mult: 0.1
  cache_write_mult: 1.0
per_agent_budget_usd: 3
total_budget_usd: 30
max_wall_hours: 1.0

codex:
  binary: codex
  auth_file: ~/.codex/auth.json

board:
  url: http://127.0.0.1:7440
  operator_token_file: ../../boards/snake-codex/operator.token

node:
  cores_per_agent: 4
  mem: 4G
  run_timeout_s: 600

gate:
  train_episodes: 100
  heldout_episodes: 500

local_cpu_quota: "100%"
local_mem_max: 2G

opening_round:
  reveal_after_s: 600
  answer_turn_s: 90
